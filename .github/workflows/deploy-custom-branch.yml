name: Deploy (custom branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (e.g. feature/xyz)'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          # This will check out the branch passed via the workflow_dispatch input.
          ref: ${{ inputs.branch }}

      - name: Set up Node (example - remove if not needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (example)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found — running npm ci"
            npm ci
          else
            echo "No lockfile — running npm install"
            npm install
          fi

      - name: Build (example)
        run: npm run build --if-present

      - name: Deploy (replace with your actual deploy commands)
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        run: |
          echo "Deploying branch: $DEPLOY_BRANCH"
          # Replace the lines below with your real deployment commands.
          # Example placeholder: copy build to a server using rsync (requires SSH_PRIVATE_KEY secret)
          # mkdir -p ~/.ssh
          # echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          # chmod 600 ~/.ssh/id_rsa
          # rsync -avz --delete ./dist/ user@your-server:/var/www/site
          #
          # Example placeholder for GitHub Pages using gh-pages:
          # npx gh-pages -d dist
          #
          # Or call your existing deploy script:
          # npm run deploy --if-present

      - name: Notify (optional)
        run: echo "Deployment finished for ${{ inputs.branch }}"
